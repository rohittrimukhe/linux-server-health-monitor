# LSHME backup.conf
# Backup verification. Products are auto-detected (enabled = auto). Add [job:NAME] sections to verify
# backup files/directories or backup log files against a maximum age (RPO).

[netbackup]
enabled = auto
max_age_hours = 26

[backupexec]
enabled = auto

[veeam]
enabled = auto
max_age_hours = 26


