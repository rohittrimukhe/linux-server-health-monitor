# LSHME custom.conf
# Custom checks using the Nagios plugin convention (exit 0 OK, 1 WARNING, 2 CRITICAL, 3 UNKNOWN).
# Scripts must be owned by root and not writable by group/others.

[general]
checks_dir = 
default_timeout = 60


