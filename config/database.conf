# LSHME database.conf
# Database instances. Running Oracle/PostgreSQL/MySQL instances are auto-discovered when
# LSHME runs as root; add sections only to override or to monitor remote/password-based instances.
# Passwords never go here: put them in credentials.conf under the same section name.

[discovery]
oracle_autodiscover = yes
postgresql_autodiscover = yes
mysql_autodiscover = yes
mongodb_autodiscover = no


# --- Oracle (11g R2 .. 23ai). OS authentication as the instance owner:
# [oracle:ORCL]
# sid = ORCL
# oracle_home = /u01/app/oracle/product/11.2.0/dbhome_1
# os_user = oracle
# listener = LISTENER
# backup_max_age_hours = 26
#
# --- Oracle with a monitoring account (password in credentials.conf [oracle:PROD]):
# [oracle:PROD]
# oracle_home = /u01/app/oracle/product/19.0.0/dbhome_1
# username = lshme_monitor
# connect_identifier = //dbhost:1521/PROD
#   grant: CREATE SESSION, SELECT_CATALOG_ROLE (11g) or SELECT ANY DICTIONARY
#
# [mysql:main]
# defaults_file = /root/.my.cnf
#
# [postgresql:main]
# os_user = postgres
# port = 5432
#
# [mongodb:main]
# uri = mongodb://127.0.0.1:27017/admin
# username = monitor
#
# [sqlserver:main]
# server = localhost
# username = lshme_monitor
