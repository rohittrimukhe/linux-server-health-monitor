# LSHME exclusions.conf
# Exclusions: accepted findings that should not affect the score or raise alerts.
# Excluded findings are still listed in reports with the rule and reason. Expired rules stop applying.
# Manage with: healthcheck exclude list | add | remove   (or menu option 21)


# Cockpit uses its self-signed certificate on purpose:
# [exclude:cockpit-self-signed]
# code = COCKPIT_SELF_SIGNED
# module = cockpit
# reason = Internal admin console; CA-signed certificate not required
# owner = infra-team
#
# A planned temporary condition with an expiry date:
# [exclude:archive-full-until-migration]
# code = DISK_USAGE
# component = /archive
# reason = Archive migration in progress (CHG-1234)
# until = 2026-12-31
#
# Wildcards: every INFO-level Oracle invalid-object note on a dev host
# [exclude:dev-invalid-objects]
# code = ORACLE_INVALID_*
# hosts = dev-*
# reason = Development databases
