# LSHME main.conf
# General settings, module selection, security policy, log/network/KVM/Cockpit options and integrations.

[general]
company = 
customer = 
environment = Production
prepared_by = 
location = 
logo = 
command_timeout = 30
run_timeout = 1800

[paths]
data_dir = 
report_dir = 
log_dir = 

[modules]
# all, or a comma list (system,cpu_memory,storage,services,network,hardware,kvm,cockpit,database,backup,logs,security,certificates,containers,cluster,applications,custom)
enabled = all
disabled = 

[security]
expected_selinux = enforcing
require_firewall = yes
permit_root_login_allowed = no
password_authentication_allowed = yes
require_auditd = no
check_updates = yes
updates_cache_hours = 12
updates_timeout = 120

[logs]
max_lines = 200000
extra_files = 
# category|SEVERITY|regex entries, comma-separated
extra_patterns = 

[network]
dns_test_names = 
ping_targets = 
# host:port entries, comma-separated
tcp_checks = 
expected_interfaces = 
ping_gateway = yes

[kvm]
uri = qemu:///system
sample_seconds = 2

[cockpit]
required = no
probe_https = yes

[applications]
# url|expected_status|required_text entries, comma-separated
http_checks = 
check_mail_queue = yes

[history]
enabled = yes

[integrations]
# e.g. /var/lib/node_exporter/textfile_collector/lshme.prom
prometheus_textfile = 
# also write each run as <host>.json here (for central import)
agent_dropdir = 

[watch]
interval = 60
confirm = 2
repeat_minutes = 60
recovery_alerts = yes
rotation_modules = services,database,kvm,cockpit,network,backup,cluster,certificates
rotation_minutes = 15
alert_min_severity = WARNING
alert_email = yes
alert_to = 
syslog = yes
webhook_url = 
max_rss_mb = 100
netfs_timeout = 5
metrics_hours = 24

[performance]
nice = 10
idle_io = yes

[sla]
target_percent = 99.9

[dashboard]
title = 
stale_hours = 26
refresh_seconds = 300
auto_build = yes
