# LSHME reports.conf
# Report defaults. formats: html,pdf,xlsx,pptx,txt,csv,json or all. report_type: daily | weekly | monthly | executive | technical | full

[reports]
formats = html,pdf,json
report_type = technical
include_appendix = yes
title = 
max_evidence_chars = 3000
# PDF paper: a4, letter, legal or a3; orientation auto (sideways only when a table needs it), portrait or landscape
pdf_page_size = a4
pdf_orientation = auto
pdf_margin_mm = 8
# Which report types show the capacity forecast ("full in N days", act-by date): daily, weekly, monthly
capacity_forecast_in = weekly, monthly
forecast_lead_days = 14
