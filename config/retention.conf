# LSHME retention.conf
# Retention per report category, logs, history and config backups, plus space-based cleanup.
# Space cleanup order: adhoc, daily, custom, weekly, fleet, monthly (oldest first); the newest report per
# host/schedule is always kept. Preview: healthcheck retention preview | healthcheck retention space

[retention]
daily_days = 30
weekly_days = 90
monthly_days = 365
adhoc_days = 30
fleet_days = 90
custom_days = 60
logs_days = 30
error_logs_days = 90
audit_logs_days = 365
auto_apply = yes
email_log_days = 90
history_days = 365
config_backups_keep = 30
# reports older than this are gzip-compressed file by file (name.html.gz): zcat, zless and zgrep work on them and
# LRS Vitals shows, searches and e-mails them without unpacking. 0 = never
compress_after_days = 1
# after this many days only the report data is kept: PDF, Excel, HTML, PowerPoint, CSV and text files are removed once they are
# checked to rebuild byte for byte from the report's stored source, and are rebuilt whenever someone opens, downloads or mails them.
# 0 = keep every file
keep_rendered_days = 7
# report files that are always kept as files (json = the report's data in readable form)
keep_formats = json
# keep the monthly (and SLA) PDF as a file as well, for audits
keep_monthly_pdf = yes
# raw data: every measurement as it was taken, one file per day (00:00:00 to 23:59:59), sealed at 02:00 (vitals raw ...)
raw_enabled = yes
# days of raw data to keep (about 0.3 MB per server per day once sealed)
raw_days = 730
keep_latest = yes
# move expired reports here instead of deleting them
archive_dir = 
# space cleanup starts when the report filesystem has less free space than this
min_free_percent = 10
# yes = also delete reports for space (before every run and on 'retention apply')
space_cleanup = yes
# ...and deletes the least valuable old reports until this much is free
free_target_percent = 15
# size cap for the report directory in GB (0 = no cap)
max_report_dir_gb = 0
# space cleanup never deletes reports newer than this (days)
space_min_keep_days = 1
