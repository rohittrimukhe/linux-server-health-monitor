# LSHME retention.conf
# Retention per report category, logs, history and config backups, plus space-based cleanup.
# Space cleanup order: adhoc, daily, custom, weekly, fleet, monthly (oldest first); the newest report per
# host/schedule is always kept. Preview: healthcheck retention preview | healthcheck retention space

[retention]
daily_days = 30
weekly_days = 90
monthly_days = 365
adhoc_days = 30
fleet_days = 90
custom_days = 60
logs_days = 30
error_logs_days = 90
audit_logs_days = 365
auto_apply = yes
email_log_days = 90
history_days = 365
config_backups_keep = 30
compress_after_days = 7
keep_latest = yes
# move expired reports here instead of deleting them
archive_dir = 
# space cleanup starts when the report filesystem has less free space than this
min_free_percent = 10
# yes = also delete reports for space (before every run and on 'retention apply')
space_cleanup = yes
# ...and deletes the least valuable old reports until this much is free
free_target_percent = 15
# size cap for the report directory in GB (0 = no cap)
max_report_dir_gb = 0
# space cleanup never deletes reports newer than this (days)
space_min_keep_days = 1
