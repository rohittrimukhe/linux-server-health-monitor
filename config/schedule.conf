# LSHME schedule.conf
# Schedules. Each [schedule:NAME] runs with its own modules, period (days), formats, type and recipients.
# frequency: hourly | daily | weekly | monthly | custom (calendar = systemd OnCalendar, or cron with backend=cron)
# Apply changes with: healthcheck schedule install

[scheduler]
backend = auto
retries = 2
retry_delay = 300
systemd_dir = /etc/systemd/system
cron_file = /etc/cron.d/lshme

[schedule:daily]
enabled = yes
frequency = daily
time = 07:00
days = 1
modules = all
formats = html,pdf,json
report_type = technical
email = yes
send_policy = 
to = 
cc = 

[schedule:weekly]
enabled = yes
frequency = weekly
weekday = mon
time = 08:00
days = 7
modules = all
formats = html,pdf,xlsx,json
report_type = technical
email = yes
send_policy = 
to = 
cc = 

[schedule:monthly]
enabled = yes
frequency = monthly
monthday = 1
time = 09:00
days = 30
modules = all
formats = html,pdf,xlsx,pptx,json
report_type = full
email = yes
send_policy = always
to = 
cc = 
sla_report = yes
inventory_report = yes


