# LSHME servers.conf
# Central multi-server monitoring. Each [server:NAME] is reached over SSH with key authentication.

[defaults]
user = root
port = 22
parallel = 8
timeout = 900
remote_command = /usr/local/bin/healthcheck agent --days {days}
inventory_command = /usr/local/bin/healthcheck inventory --json
ssh_options = -o BatchMode=yes -o ConnectTimeout=15
identity_file = 


