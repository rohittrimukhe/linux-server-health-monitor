# LSHME smtp.conf
# Email delivery. The SMTP password goes in credentials.conf [smtp] password = ...
# send_policy: always | issues (warning/critical only) | critical | never

[smtp]
method = smtp
host = 
port = 587
security = starttls
username = 
from = 
to = 
cc = 
bcc = 
critical_to = 
subject_prefix = [LSHME]
send_policy = always
max_attachment_mb = 15
attach_formats = pdf,xlsx,html
retries = 3
retry_delay = 20
timeout = 30
sendmail_path = /usr/sbin/sendmail
