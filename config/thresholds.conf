# LSHME thresholds.conf
# Warning/critical thresholds. Percent unless the key says otherwise.
# [disk_overrides] sets per-mount thresholds:  /archive = 90,97

[cpu]
warning = 85
critical = 95
iowait_warning = 20
steal_warning = 10
sample_seconds = 1

[load]
per_core_warning = 1.5
per_core_critical = 3.0

[memory]
warning = 85
critical = 95

[swap]
warning = 50
critical = 80

[disk]
warning = 80
critical = 90

[disk_overrides]

[inode]
warning = 80
critical = 90

[disk_io]
util_warning = 90
await_warning_ms = 50
sample_seconds = 1

[network]
error_ratio_warning = 0.1
packet_loss_warning = 10
packet_loss_critical = 50
latency_warning_ms = 100

[services]
restart_warning = 3

[kvm]
pool_warning = 80
pool_critical = 90
vcpu_overcommit_warning = 4.0
memory_overcommit_warning = 1.0
snapshot_age_warning_days = 7
vm_cpu_warning = 90

[certificates]
warning_days = 30
critical_days = 7

[logs]
ssh_fail_warning = 20
ssh_fail_critical = 200

[oracle]
tablespace_warning = 85
tablespace_critical = 95
fra_warning = 80
fra_critical = 90
limits_warning = 80
limits_critical = 90
blocking_seconds = 300
backup_max_age_hours = 26
archivelog_backup_max_age_hours = 24
dg_lag_warning_seconds = 300
dg_lag_critical_seconds = 1800
invalid_objects_warning = 50
long_running_seconds = 3600
include_undo_temp = no
check_rman = yes
alert_log_max_mb = 16

[mysql]
connections_warning = 80
connections_critical = 90
replication_lag_warning = 300
replication_lag_critical = 1800

[postgresql]
connections_warning = 80
connections_critical = 90
long_query_minutes = 30
xid_age_warning = 1000000000
xid_age_critical = 1500000000
replication_lag_warning_mb = 512
replication_lag_critical_mb = 4096

[mongodb]
connections_warning = 80
connections_critical = 90

[sqlserver]
backup_max_age_hours = 26

[backup]
default_max_age_hours = 26

[hardware]
temperature_warning_c = 75
temperature_critical_c = 90

[mail]
queue_warning = 100
queue_critical = 1000

[history]
forecast_warning_days = 30
forecast_critical_days = 7
forecast_min_samples = 3


# [disk_overrides]
# /archive = 90,97
# /u01 = 85,92
