# LSHME web.conf
# The web interface (systemhealth web). It is OFF until enabled here or in Configuration > Web interface.
# Passwords are stored as salted PBKDF2 hashes in [users]; manage them with:
#   systemhealth web passwd NAME        (set or change a password)
#   systemhealth web user add NAME      (add a user; --role viewer for read-only)
# By default it listens on 127.0.0.1 only (reach it through an SSH tunnel). To open it to the network,
# set bind = 0.0.0.0 and keep tls = yes (a self-signed certificate is created if none is given).

[web]
enabled = no
bind = 127.0.0.1
port = 8443
tls = yes
cert = 
key = 
session_minutes = 30
max_login_failures = 5
allow_plain_http = no
# Sign in with a Linux user name and password (the web server must run as root).
# system_users: * = every normal account (root and users with UID 1000+ and a login shell), or a list such as root,oracle. Empty = off.
# Rights follow Linux: root and members of system_admin_groups (wheel, sudo) are administrators; everyone else gets
# system_default_role (viewer = read-only, admin, or none = refused).
system_users = *

# HTTPS certificate for this web interface only (nothing else on the server is changed).
#   tls_source = self-signed        the default: a self-signed certificate is created automatically (browsers show a warning once)
#                letsencrypt        a genuine, free, publicly trusted certificate (optional; no self-signed fallback in this mode)
#                custom             your own cert and key (below)
# Let's Encrypt needs a public DNS NAME (not an IP address, not .local/.lan/.internal). Two ways to prove you own it:
#   acme_challenge = http           this server answers on port 80, reachable from the internet (or acme_webroot)
#   acme_challenge = dns            only a TXT record is needed, so a server on a PRIVATE address (192.168.x.x) works too:
#                                   acme_dns_provider = cloudflare | duckdns | hook   (token in credentials.conf, section [acme])
# Free option for a private server: a DuckDNS sub-domain (lrsvitals.duckdns.org) set to the server's address, challenge = dns.
# Renewal is automatic while the web service runs. Start with acme_directory = staging to test.
#   acme_domains =                  empty = this server's FQDN, or a list: portal.example.com, vitals.example.com
#   acme_email =                    where Let's Encrypt sends expiry notices
#   acme_directory = production     production, staging (for testing) or a full ACME directory URL
#   acme_challenge = http           http (port 80) or dns (needs acme_dns_hook)
#   acme_webroot =                  http only: a folder served on port 80 by another web server (otherwise this program listens on port 80 briefly)
#   acme_dns_hook =                 dns only: a script called as  hook add|remove _acme-challenge.NAME VALUE
#   acme_renew_days = 30            renew when fewer days than this are left
tls_source = self-signed
acme_dns_provider =
acme_domains =
acme_email =
acme_directory = production
acme_challenge = http
acme_http_port = 80
acme_webroot =
acme_dns_hook =
acme_dns_wait = 60
acme_renew_days = 30
system_admin_groups = wheel, sudo
system_default_role = viewer

[users]

[roles]

# Customer portal: tie an account to a customer group (the group = of its servers in servers.conf).
# That account is read-only and sees only that group's servers and reports, with the group's branding.
[user_groups]
# alice = acme
