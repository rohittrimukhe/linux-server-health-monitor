<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <title>LSHME Health</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="lshme.css">
    <script src="../base1/cockpit.js"></script>
    <script src="lshme.js"></script>
</head>
<body>
    <header class="hdr">
        <div>
            <h1>Server health</h1>
            <p id="sub">Loading…</p>
        </div>
        <img class="logo" src="lrs_logo.png" alt="LRS Services">
    </header>
    <main>
        <section class="row">
            <div class="card score-card">
                <div id="score" class="score">–</div>
                <div>
                    <div id="status" class="status">–</div>
                    <div id="counts" class="muted"></div>
                    <div class="actions">
                        <button id="run" class="btn primary" type="button">Run health check now</button>
                        <span id="runmsg" class="muted"></span>
                    </div>
                </div>
            </div>
            <div class="card">
                <h2>Real-time monitoring</h2>
                <div id="watch" class="muted">No real-time data yet. Start it with <code>healthcheck watch install</code>.</div>
            </div>
        </section>
        <section class="card">
            <h2>Issues requiring attention</h2>
            <div id="issues" class="muted">–</div>
        </section>
        <section class="card">
            <h2>Module health</h2>
            <div id="modules"></div>
        </section>
        <section class="card">
            <h2>Reports</h2>
            <div id="reports" class="muted">–</div>
        </section>
    </main>
    <footer id="footer">© 2026 LRS Services Pvt Ltd, Mumbai. All rights reserved.</footer>
</body>
</html>
